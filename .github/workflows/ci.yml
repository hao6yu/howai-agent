name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: ./scripts/release-gate.sh

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db lint --local --level warning --fail-on warning
      - run: supabase db advisors --local --type performance --level warn --fail-on warn
      - run: supabase test db
      - run: curl --fail --silent --show-error --output /dev/null --request OPTIONS http://127.0.0.1:54321/functions/v1/openai-proxy
      - if: always()
        run: supabase stop --no-backup
